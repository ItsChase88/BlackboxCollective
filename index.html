<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Blackbox Collective — a shared hub for innovators, creators, and doers to brainstorm, get feedback, and turn ideas into reality."
    />
    <title>Blackbox Collective</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/img/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="hero">
      <div class="hero__glow" aria-hidden="true"></div>

      <div class="hero__visual">
        <img
          class="hero__logo"
          src="assets/img/BlackboxCollective.png"
          alt="Blackbox Collective — an open black box releasing ideas, code, and creation"
          width="1200"
          height="1200"
        />
      </div>

      <div class="hero__content">
        <h1 class="hero__headline">Build on your own. Not in isolation.</h1>
        <p class="hero__support">
          A shared hub for innovators, creators, and doers to brainstorm, get
          feedback, and turn ideas into reality.
        </p>
        <a
          class="hero__cta"
          href="https://discord.gg/pf53Fa3Qgd"
          target="_blank"
          rel="noopener noreferrer"
        >
          Apply to Join
        </a>
      </div>
    </main>

    <script src="js/main.js" defer></script>
  </body>
</html>
